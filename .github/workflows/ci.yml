name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancela execuções antigas só em PR; na main cada commit mantém seu resultado.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Um job por serviço. Todos rodam sempre: são rápidos e evitam "verde por omissão".
jobs:
  lint:
    name: ESLint (workspace TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  packages:
    name: pacotes compartilhados (contracts, messaging, observability)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter "./packages/**" typecheck
      - name: Testes
        run: pnpm --filter @wba/contracts --filter @wba/messaging test

  messaging-gateway:
    name: messaging-gateway (provedores, webhook e sender)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @wba/messaging-gateway typecheck
      - name: Testes unitários e de contrato das ACLs (Cloud API e Whatsmiau)
        run: pnpm --filter @wba/messaging-gateway test
      - name: Integração (Redis e RabbitMQ reais via testcontainers)
        run: pnpm --filter @wba/messaging-gateway test:integration
      - name: Build
        run: pnpm --filter @wba/messaging-gateway build
      - name: Imagem Docker
        run: docker build -f services/messaging-gateway/Dockerfile -t whatsapp-booking-agent/messaging-gateway:ci .

  booking-agent:
    name: booking-agent (domínio, agente e adaptadores)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @wba/booking-agent typecheck
      # Cliente LLM falso roteirizado: nenhum modelo real é chamado no CI.
      - name: Testes unitários (domínio, grafo, casos de uso, contratos)
        run: pnpm --filter @wba/booking-agent test
      - name: Integração (Redis real via testcontainers)
        run: pnpm --filter @wba/booking-agent test:integration
      - name: Build
        run: pnpm --filter @wba/booking-agent build
      - name: Imagem Docker
        run: docker build -f services/booking-agent/Dockerfile -t whatsapp-booking-agent/booking-agent:ci .

  saas-mcp-server:
    name: saas-mcp-server (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/saas-mcp-server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/saas-mcp-server/go.mod
          cache-dependency-path: services/saas-mcp-server/go.sum
      - name: Lint (gofmt + go vet)
        run: make lint
      - name: Testes (unitários, contrato da ACL do SaaS e MCP em memória)
        run: make test
      - name: Build
        run: make build
      - name: Imagem Docker
        run: docker build -t whatsapp-booking-agent/saas-mcp-server:ci .

  media-processor:
    name: media-processor (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/media-processor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar (sem o modelo de transcrição)
        run: make install
      - name: Lint (ruff + mypy estrito)
        run: make lint
      - name: Testes (transcritor falso, miniatura com Pillow)
        run: make test
      - name: Imagem Docker
        run: docker build -t whatsapp-booking-agent/media-processor:ci .

  api-gateway:
    name: "api-gateway (Kong DB-less: configuração e smoke das políticas)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Imagem Docker
        run: docker build -t whatsapp-booking-agent/api-gateway:ci infra/gateway
      - name: Par de chaves de teste do painel
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          openssl genrsa -out "$RUNNER_TEMP/keys/private.pem" 2048
          openssl rsa -in "$RUNNER_TEMP/keys/private.pem" -pubout -out "$RUNNER_TEMP/keys/public.pem"
          chmod -R a+rX "$RUNNER_TEMP/keys"
      - name: kong config parse (o entrypoint renderiza o kong.yaml com a chave pública)
        run: |
          set -o pipefail
          {
            docker run --rm --entrypoint sh -e KONG_DATABASE=off -e RENDER_ONLY=1 -e OIDC_ISSUER=http://127.0.0.1:8180/realms/wba -e PANEL_JWT_PUBLIC_KEY_FILE=/keys/public.pem -v "$RUNNER_TEMP/keys:/keys:ro" whatsapp-booking-agent/api-gateway:ci -c '/kong/entrypoint.sh && kong config parse /tmp/kong.rendered.yaml'
          } 2>&1 | tee "$RUNNER_TEMP/kong-config.log"
      - name: O entrypoint recusa chave pública ausente, vazia ou fora do formato
        run: |
          : > "$RUNNER_TEMP/keys/empty.pem"
          echo lixo > "$RUNNER_TEMP/keys/garbage.pem"
          chmod a+r "$RUNNER_TEMP/keys/empty.pem" "$RUNNER_TEMP/keys/garbage.pem"
          for key in empty.pem garbage.pem missing.pem; do
            if docker run --rm --entrypoint sh -e RENDER_ONLY=1 -e OIDC_ISSUER=http://127.0.0.1:8180/realms/wba -e "PANEL_JWT_PUBLIC_KEY_FILE=/keys/$key" -v "$RUNNER_TEMP/keys:/keys:ro" whatsapp-booking-agent/api-gateway:ci -c '/kong/entrypoint.sh'; then
              echo "FALHA o entrypoint aceitou $key"; exit 1
            fi
          done
      - name: Smoke das políticas (JWT RS256, webhooks sem JWT, rotas internas fora, limite de corpo)
        run: |
          set -o pipefail
          {
            docker run -d --name gw -p 8000:8000 -e OIDC_ISSUER=http://127.0.0.1:8180/realms/wba -e PANEL_JWT_PUBLIC_KEY_FILE=/keys/public.pem -v "$RUNNER_TEMP/keys:/keys:ro" whatsapp-booking-agent/api-gateway:ci
            for i in $(seq 1 30); do docker exec gw kong health >/dev/null 2>&1 && break; sleep 2; done
            PANEL_JWT_PRIVATE_KEY_FILE="$RUNNER_TEMP/keys/private.pem" infra/gateway/smoke.sh http://127.0.0.1:8000 || { docker logs gw; exit 1; }
          } 2>&1 | tee "$RUNNER_TEMP/smoke.log"
      - name: Diagnóstico dos passos que falharam
        if: failure()
        run: python3 scripts/ci-annotate.py api-gateway "$RUNNER_TEMP/kong-config.log" "$RUNNER_TEMP/smoke.log"

  web:
    name: web (painel Vue)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (vue-tsc)
        run: pnpm --filter @wba/web typecheck
      - name: Testes
        run: pnpm --filter @wba/web test
      - name: Build
        run: pnpm --filter @wba/web build
      - name: Imagem Docker
        run: docker build -f web/Dockerfile -t whatsapp-booking-agent/web:ci .

  infra:
    name: infraestrutura (compose, Prometheus, mocks, scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: docker compose config (todos os profiles e o override do portfólio)
        run: |
          set -o pipefail
          {
            docker compose --profile core --profile observability --profile llm --profile tools --profile whatsmiau config -q
            docker compose -f docker-compose.yml -f docker-compose.portfolio.yml --profile core config -q
          } 2>&1 | tee "$RUNNER_TEMP/compose.log"
      - name: promtool valida configuração e alertas
        run: |
          set -o pipefail
          {
            docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
            docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/etc/prometheus:ro" prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml
          } 2>&1 | tee "$RUNNER_TEMP/promtool.log"
      - name: Mapeamentos do WireMock são JSON válido
        run: |
          set -o pipefail
          for f in infra/wiremock/*/mappings/*.json; do python3 -m json.tool "$f" > /dev/null || { echo "FALHA JSON inválido: $f"; exit 1; }; done 2>&1 | tee "$RUNNER_TEMP/wiremock.log"
      - name: ShellCheck
        run: |
          set -o pipefail
          shellcheck scripts/*.sh infra/minio/*.sh infra/gateway/*.sh 2>&1 | tee "$RUNNER_TEMP/shellcheck.log"
      - name: Diagnóstico dos passos que falharam
        if: failure()
        run: python3 scripts/ci-annotate.py infraestrutura "$RUNNER_TEMP/compose.log" "$RUNNER_TEMP/promtool.log" "$RUNNER_TEMP/wiremock.log" "$RUNNER_TEMP/shellcheck.log"

  helm:
    name: helm (lint e template do chart, sem cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: helm lint e helm template (imagem do Helm; nada é instalado em cluster)
        run: |
          set -o pipefail
          {
            helm() { docker run --rm -v "$PWD/deploy/helm:/charts:ro" alpine/helm:3.17.1 "$@"; }
            helm lint /charts/wba --set secretName=wba-secrets
            helm template wba /charts/wba --set secretName=wba-secrets --set ingress.enabled=true > "$RUNNER_TEMP/rendered.yaml"
            test "$(grep -c '^kind: Deployment' "$RUNNER_TEMP/rendered.yaml")" = 7
            test "$(grep -c '^kind: Service$' "$RUNNER_TEMP/rendered.yaml")" = 7
            grep -q '^kind: NetworkPolicy' "$RUNNER_TEMP/rendered.yaml"
            grep -q '^kind: Ingress' "$RUNNER_TEMP/rendered.yaml"
            # Sem secretName o chart precisa falhar: ele não cria segredos.
            if helm template wba /charts/wba >/dev/null 2>&1; then echo "FALHA o chart renderizou sem secretName"; exit 1; fi
          } 2>&1 | tee "$RUNNER_TEMP/helm.log"
      - name: Diagnóstico dos passos que falharam
        if: failure()
        run: python3 scripts/ci-annotate.py helm "$RUNNER_TEMP/helm.log"

  e2e:
    name: ponta a ponta (compose real, Keycloak, Kong) e carga no webhook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sobe o profile core (build das imagens, healthchecks, Keycloak com o realm importado)
        run: docker compose --profile core up -d --build --wait --wait-timeout 900
      - name: Ponta a ponta (webhook assinado até a resposta no mock da Cloud API, painel por Keycloak, isolamento)
        run: |
          set -o pipefail
          scripts/e2e.sh 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - name: "Carga no webhook (k6, 50 req/s de contatos distintos por 20 s e uma rajada de 20 mensagens de um contato)"
        run: |
          set -o pipefail
          docker run --rm --network whatsapp-booking-net -v "$PWD/infra/load:/scripts:ro" grafana/k6:1.0.0 run /scripts/webhook.js 2>&1 | tee "$RUNNER_TEMP/k6.log"
      - name: A fila do agente esvazia e a DLQ termina vazia (ocupação de contato não é falha)
        run: |
          set -o pipefail
          {
            api() { curl -fsS -u wba:dev-only-change-me "http://127.0.0.1:15672/api/queues/%2F/$1" | python3 -c 'import json,sys; q=json.load(sys.stdin); print(q["messages"])'; }
            for _ in $(seq 1 90); do
              pending="$(api booking-agent.inbound)"; retry="$(api booking-agent.inbound.retry)"
              [ "$pending" = 0 ] && [ "$retry" = 0 ] && break
              sleep 2
            done
            echo "pendentes=$pending em retry=$retry"
            [ "$pending" = 0 ] && [ "$retry" = 0 ] || { echo "FALHA a fila do agente não esvaziou"; exit 1; }
            dlq="$(api booking-agent.inbound.dlq)"
            echo "DLQ do booking-agent: $dlq"
            [ "$dlq" = 0 ] || { echo "FALHA a DLQ do booking-agent não está vazia"; exit 1; }
          } 2>&1 | tee "$RUNNER_TEMP/dlq.log"
      - name: Logs dos serviços quando algo falhou
        if: failure()
        run: docker compose --profile core logs --no-color --tail=200
      - name: Diagnóstico dos passos que falharam
        if: failure()
        run: python3 scripts/ci-annotate.py e2e "$RUNNER_TEMP/e2e.log" "$RUNNER_TEMP/k6.log" "$RUNNER_TEMP/dlq.log"
      - name: Derruba o ambiente
        if: always()
        run: docker compose --profile core down -v --remove-orphans
