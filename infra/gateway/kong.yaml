# Configuração declarativa do api-gateway (Kong OSS, modo DB-less; ADR 0012).
# Fonte da verdade das políticas de borda: roteamento, rate limit e JWT do painel.
# Os marcadores entre sublinhados duplos são trocados pelo entrypoint a partir do ambiente (o Kong não
# interpola variáveis no arquivo declarativo).
_format_version: "3.0"
_transform: true

services:
  # Webhooks públicos dos provedores. Sem JWT: quem chama é o provedor, e cada um se autentica
  # no messaging-gateway (HMAC da Meta; segredo no cabeçalho da instância do Whatsmiau).
  - name: messaging-webhook
    protocol: http
    host: messaging-webhook
    port: 8080
    connect_timeout: 2000
    read_timeout: 10000
    write_timeout: 10000
    # Sem retry: o provedor reentrega e a idempotência está no gateway de mensagens.
    retries: 0
    routes:
      - name: webhook-cloud-api
        paths: [/webhooks/cloud-api]
        methods: [GET, POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config: &webhook_rate
              minute: 600
              limit_by: ip
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: Rate limit exceeded
          - name: request-size-limiting
            config:
              allowed_payload_size: 256
              size_unit: kilobytes
              require_content_length: false
      - name: webhook-whatsmiau
        paths: [/webhooks/whatsmiau]
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config: *webhook_rate
          # O Whatsmiau pode embutir mídia em base64 no corpo.
          - name: request-size-limiting
            config:
              allowed_payload_size: 20
              size_unit: megabytes
              require_content_length: false

  # API do painel. O JWT do atendente (emitido pelo Keycloak, RS256) é validado aqui: assinatura,
  # emissor e expiração. O Authorization segue intacto para o booking-agent, que valida de novo e é
  # quem decide estúdio e papel a partir do token (ADR 0013).
  - name: booking-agent-panel
    protocol: http
    host: booking-agent
    port: 8081
    connect_timeout: 2000
    read_timeout: 10000
    write_timeout: 10000
    retries: 0
    routes:
      - name: panel-api
        paths: [/api]
        methods: [GET, POST, PUT, PATCH, DELETE]
        strip_path: false
        plugins:
          - name: jwt
            config:
              header_names: [authorization]
              uri_param_names: []
              cookie_names: []
              key_claim_name: iss
              claims_to_verify: [exp]
              maximum_expiration: 3600
              run_on_preflight: false
          - name: rate-limiting
            config:
              minute: 120
              limit_by: consumer
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429
              error_message: Rate limit exceeded
          - name: request-size-limiting
            config:
              allowed_payload_size: 64
              size_unit: kilobytes
              require_content_length: false

# Não há rota para /internal (mídia e avisos): são APIs entre serviços, só na rede interna.

consumers:
  # Um consumidor para o realm: a chave é o emissor (claim iss) e a pública vem do Keycloak.
  - username: painel
    jwt_secrets:
      - key: "__OIDC_ISSUER__"
        algorithm: RS256
        rsa_public_key: |
          __PANEL_JWT_PUBLIC_KEY__

plugins:
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
