rule_files:
  - /etc/prometheus/alerts.yml

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: messaging-webhook
    static_configs: [{ targets: ["messaging-webhook:8080"] }]
  - job_name: messaging-sender
    static_configs: [{ targets: ["messaging-sender:8082"] }]
  - job_name: booking-agent
    static_configs: [{ targets: ["booking-agent:8081"] }]
  - job_name: saas-mcp-server
    static_configs: [{ targets: ["saas-mcp-server:8090"] }]
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]
