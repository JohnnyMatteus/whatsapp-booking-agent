# Ambiente local do whatsapp-booking-agent (ADR 0007).
#   core:          serviços, RabbitMQ, Redis, MinIO e mocks da Cloud API e do SaaS
#   observability: Prometheus, Jaeger e Grafana
#   llm:           Ollama para o LLM local (opcional; qualquer API compatível com OpenAI serve)
#   tools:         cliente do MinIO para inspecionar os áudios guardados
# Senhas e tokens abaixo são só de desenvolvimento (dev-only-*). Valores reais vão no .env.

x-node-service: &node-service
  restart: unless-stopped
  networks: [booking-net]
  environment: &common-env
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-wba}:${RABBITMQ_PASSWORD:-dev-only-change-me}@rabbitmq:5672
    REDIS_URL: redis://redis:6379
    LOG_LEVEL: ${LOG_LEVEL:-info}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-gateway-env: &gateway-env
  <<: *common-env
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-dev-only-change-me-app-secret}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-dev-only-verify-token}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-dev-only-access-token}
  WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-http://cloud-api-mock:8080}
  WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
  TENANT_PHONE_NUMBERS: ${TENANT_PHONE_NUMBERS:-{"100000000000001":"estudio-lotus"}}

services:
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    profiles: [core]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-wba}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev-only-change-me}
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [booking-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4.6-alpine
    profiles: [core]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [booking-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-03T14-56-28Z
    profiles: [core]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wba-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-only-change-me}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks: [booking-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria o bucket dos áudios (idempotente) e termina.
  minio-init:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    profiles: [core]
    entrypoint: ["/bin/sh", "/init/create-bucket.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wba-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-only-change-me}
      AUDIO_BUCKET: ${AUDIO_BUCKET:-wba-audio}
    volumes:
      - ./infra/minio/create-bucket.sh:/init/create-bucket.sh:ro
    networks: [booking-net]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Mock da WhatsApp Cloud API (envio de mensagens e download de mídia).
  cloud-api-mock:
    image: wiremock/wiremock:3.13.2
    profiles: [core]
    command: ["--port", "8080", "--global-response-templating", "--disable-banner"]
    ports:
      - "127.0.0.1:${CLOUD_API_MOCK_PORT:-9090}:8080"
    volumes:
      - ./infra/wiremock/cloud-api/mappings:/home/wiremock/mappings:ro
      - ./infra/wiremock/cloud-api/__files:/home/wiremock/__files:ro
    networks: [booking-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Mock da API do SaaS para rodar sem o saas-multitenant (o override do portfólio troca pelo real).
  saas-mock:
    image: wiremock/wiremock:3.13.2
    profiles: [core]
    command: ["--port", "8080", "--global-response-templating", "--disable-banner"]
    volumes:
      - ./infra/wiremock/saas/mappings:/home/wiremock/mappings:ro
      - ./infra/wiremock/saas/__files:/home/wiremock/__files:ro
    networks: [booking-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  saas-mcp-server:
    build: ./services/saas-mcp-server
    image: whatsapp-booking-agent/saas-mcp-server:dev
    profiles: [core]
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8090"
      SAAS_BASE_URL: ${SAAS_BASE_URL:-http://saas-mock:8080/api}
      SAAS_DEV_TOKENS: ${SAAS_DEV_TOKENS:-{"estudio-lotus":"dev-only-saas-token"}}
      # Com SAAS_TOKEN_URL definida, usa a conta de serviço do estúdio no Keycloak (ADR 0009).
      SAAS_TOKEN_URL: ${SAAS_TOKEN_URL:-}
      SAAS_AGENT_CLIENTS: ${SAAS_AGENT_CLIENTS:-{}}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-dev-only-mcp-token-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [booking-net]
    depends_on:
      saas-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/saas-mcp-server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  whatsapp-webhook:
    <<: *node-service
    build: { context: ., dockerfile: services/whatsapp-gateway/Dockerfile }
    image: whatsapp-booking-agent/whatsapp-gateway:dev
    profiles: [core]
    command: ["node", "--enable-source-maps", "dist/main-webhook.js"]
    environment:
      <<: *gateway-env
      PORT: "8080"
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-8080}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  whatsapp-sender:
    <<: *node-service
    # Mesma imagem do webhook, outro processo (ADR 0001); o build em cache sai instantâneo.
    build: { context: ., dockerfile: services/whatsapp-gateway/Dockerfile }
    image: whatsapp-booking-agent/whatsapp-gateway:dev
    profiles: [core]
    command: ["node", "--enable-source-maps", "dist/main-sender.js"]
    environment:
      <<: *gateway-env
      PORT: "8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
      cloud-api-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  booking-agent:
    <<: *node-service
    build: { context: ., dockerfile: services/booking-agent/Dockerfile }
    image: whatsapp-booking-agent/booking-agent:dev
    profiles: [core]
    environment:
      <<: *common-env
      PORT: "8081"
      MCP_SERVER_URL: http://saas-mcp-server:8090/mcp
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-dev-only-mcp-token-change-me}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-dev-only-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b-instruct}
      STUDIO_TIMEZONE: ${STUDIO_TIMEZONE:-America/Sao_Paulo}
      PANEL_API_TOKEN: ${PANEL_API_TOKEN:-dev-only-panel-token}
    ports:
      - "127.0.0.1:${BOOKING_AGENT_PORT:-8081}:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      saas-mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  transcription-worker:
    build: ./services/transcription-worker
    image: whatsapp-booking-agent/transcription-worker:dev
    profiles: [core]
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-wba}:${RABBITMQ_PASSWORD:-dev-only-change-me}@rabbitmq:5672
      WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-http://cloud-api-mock:8080}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-dev-only-access-token}
      AUDIO_BUCKET: ${AUDIO_BUCKET:-wba-audio}
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-wba-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dev-only-change-me}
      TRANSCRIBER: ${TRANSCRIBER:-fake}
    networks: [booking-net]
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    image: whatsapp-booking-agent/web:dev
    profiles: [core]
    restart: unless-stopped
    environment:
      BOOKING_AGENT_URL: http://booking-agent:8081
      PANEL_API_TOKEN: ${PANEL_API_TOKEN:-dev-only-panel-token}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    networks: [booking-net]
    depends_on:
      booking-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:0.9.6
    profiles: [llm]
    volumes:
      - ollama-data:/root/.ollama
    networks: [booking-net]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    networks: [booking-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: [observability]
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    networks: [booking-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:13133/status"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-only-change-me}
    volumes:
      - ./infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [booking-net]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  mc:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    profiles: [tools]
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null && mc ls --recursive local/$$AUDIO_BUCKET"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wba-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-only-change-me}
      AUDIO_BUCKET: ${AUDIO_BUCKET:-wba-audio}
    networks: [booking-net]
    depends_on:
      minio:
        condition: service_healthy

volumes:
  rabbitmq-data:
  redis-data:
  minio-data:
  ollama-data:
  prometheus-data:
  grafana-data:

networks:
  booking-net:
    name: whatsapp-booking-net
