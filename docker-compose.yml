# Ambiente local do whatsapp-booking-agent (ADR 0007).
#   core:          api-gateway, Keycloak (login do painel), serviços, RabbitMQ, Redis, S3 local (LocalStack) e mocks da Cloud API e do SaaS
#   whatsmiau:     mock do Whatsmiau (provedor alternativo, ADR 0010); troque TENANT_CHANNELS para usá-lo
#   observability: Prometheus, Jaeger e Grafana
#   llm:           Ollama para o LLM local (opcional; qualquer API compatível com OpenAI serve)
# Senhas e tokens abaixo são só de desenvolvimento (dev-only-*). Valores reais vão no .env.

x-node-service: &node-service
  restart: unless-stopped
  networks: [booking-net]
  environment: &common-env
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-wba}:${RABBITMQ_PASSWORD:-dev-only-change-me}@rabbitmq:5672
    REDIS_URL: redis://redis:6379
    LOG_LEVEL: ${LOG_LEVEL:-info}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

# Login do painel (ADR 0013). O emissor é o endereço que o navegador enxerga; os serviços buscam as chaves
# pelo nome interno do Keycloak.
x-oidc-issuer: &oidc-issuer ${OIDC_ISSUER:-http://127.0.0.1:8180/realms/wba}

x-gateway-env: &gateway-env
  <<: *common-env
  # Provedor por estúdio (ADR 0010). Sem "provider", vale a Cloud API.
  TENANT_CHANNELS: ${TENANT_CHANNELS:-{"estudio-lotus":{"provider":"cloud-api","phoneNumberId":"100000000000001"}}}
  # Token da API interna de mídia (media-processor -> messaging-gateway).
  MEDIA_API_TOKEN: ${MEDIA_API_TOKEN:-dev-only-media-token}
  WHATSMIAU_BASE_URL: ${WHATSMIAU_BASE_URL:-http://whatsmiau-mock:8080}
  WHATSMIAU_API_KEY: ${WHATSMIAU_API_KEY:-dev-only-whatsmiau-apikey}
  WHATSMIAU_WEBHOOK_SECRET: ${WHATSMIAU_WEBHOOK_SECRET:-dev-only-whatsmiau-webhook-secret}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-dev-only-change-me-app-secret}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-dev-only-verify-token}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-dev-only-access-token}
  WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-http://cloud-api-mock:8080}
  WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}

services:
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    profiles: [core]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-wba}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev-only-change-me}
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [booking-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4.6-alpine
    profiles: [core]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [booking-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 local (LocalStack, só o serviço s3). O bucket das mídias e o ciclo de vida de 30 dias são criados pelo
  # script de init quando o LocalStack fica pronto; o healthcheck só passa depois dele.
  localstack:
    image: localstack/localstack:4.4.0
    profiles: [core]
    environment:
      SERVICES: s3
      MEDIA_BUCKET: ${MEDIA_BUCKET:-wba-media}
      DEBUG: "0"
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/10-media-bucket.sh:ro
    networks: [booking-net]
    healthcheck:
      # /init/ready devolve "completed": true e o estado de cada script (fonte do LocalStack v4.4.0).
      # Pronto = estágio concluído, script do bucket executado e nenhum em erro.
      test: ["CMD-SHELL", "out=$$(curl -fsS http://127.0.0.1:4566/_localstack/init/ready) && echo \"$$out\" | grep -Eq '\"completed\": ?true' && echo \"$$out\" | grep -q '\"SUCCESSFUL\"' && ! echo \"$$out\" | grep -q '\"ERROR\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Mock da WhatsApp Cloud API (envio de mensagens e download de mídia).
  cloud-api-mock:
    image: wiremock/wiremock:3.13.2
    profiles: [core]
    command: ["--port", "8080", "--global-response-templating", "--disable-banner"]
    ports:
      - "127.0.0.1:${CLOUD_API_MOCK_PORT:-9090}:8080"
    volumes:
      - ./infra/wiremock/cloud-api/mappings:/home/wiremock/mappings:ro
      - ./infra/wiremock/cloud-api/__files:/home/wiremock/__files:ro
    networks: [booking-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Mock do Whatsmiau (envio de texto, botões e lista). O servidor real é conectado a um número
  # por QR code e não roda em CI; ver ADR 0010.
  whatsmiau-mock:
    image: wiremock/wiremock:3.13.2
    profiles: [whatsmiau]
    command: ["--port", "8080", "--global-response-templating", "--disable-banner"]
    ports:
      - "127.0.0.1:${WHATSMIAU_MOCK_PORT:-9092}:8080"
    volumes:
      - ./infra/wiremock/whatsmiau/mappings:/home/wiremock/mappings:ro
    networks: [booking-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Provedor de identidade do painel. O realm `wba` é importado de infra/keycloak (usuários e chave de
  # desenvolvimento, sem valor fora daqui); em produção use um Keycloak com realm e chaves próprios.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    profiles: [core]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-only-change-me}
      KC_HOSTNAME: http://127.0.0.1:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak/wba-realm.json:/opt/keycloak/data/import/wba-realm.json:ro
      # Banco de desenvolvimento (H2) persistido: recriar o contêiner não troca o par de chaves do realm,
      # que o api-gateway leu ao subir.
      - keycloak-data:/opt/keycloak/data/h2
    networks: [booking-net]
    healthcheck:
      # A imagem não traz curl: teste TCP na porta de gerenciamento (9000) lendo o /health/ready.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # Mock da API do SaaS para rodar sem o saas-multitenant (o override do portfólio troca pelo real).
  saas-mock:
    image: wiremock/wiremock:3.13.2
    profiles: [core]
    command: ["--port", "8080", "--global-response-templating", "--disable-banner"]
    volumes:
      - ./infra/wiremock/saas/mappings:/home/wiremock/mappings:ro
      - ./infra/wiremock/saas/__files:/home/wiremock/__files:ro
    networks: [booking-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  saas-mcp-server:
    build: ./services/saas-mcp-server
    image: whatsapp-booking-agent/saas-mcp-server:dev
    profiles: [core]
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8090"
      SAAS_BASE_URL: ${SAAS_BASE_URL:-http://saas-mock:8080/api}
      SAAS_DEV_TOKENS: ${SAAS_DEV_TOKENS:-{"estudio-lotus":"dev-only-saas-token"}}
      # Com SAAS_TOKEN_URL definida, usa a conta de serviço do estúdio no Keycloak (ADR 0009).
      SAAS_TOKEN_URL: ${SAAS_TOKEN_URL:-}
      SAAS_AGENT_CLIENTS: ${SAAS_AGENT_CLIENTS:-{}}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-dev-only-mcp-token-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [booking-net]
    depends_on:
      saas-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/saas-mcp-server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  messaging-webhook:
    <<: *node-service
    build: { context: ., dockerfile: services/messaging-gateway/Dockerfile }
    image: whatsapp-booking-agent/messaging-gateway:dev
    profiles: [core]
    command: ["node", "--enable-source-maps", "dist/main-webhook.js"]
    environment:
      <<: *gateway-env
      PORT: "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Única entrada pública (ADR 0012): webhooks dos provedores, API do painel, rate limit e JWT.
  api-gateway:
    build: ./infra/gateway
    image: whatsapp-booking-agent/api-gateway:dev
    profiles: [core]
    restart: unless-stopped
    environment:
      OIDC_ISSUER: *oidc-issuer
      # A chave pública do realm é lida do Keycloak ao subir; sem ela o gateway não sobe.
      OIDC_REALM_URL: http://keycloak:8080/realms/wba
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    networks: [booking-net]
    depends_on:
      messaging-webhook:
        condition: service_healthy
      booking-agent:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  messaging-sender:
    <<: *node-service
    # Mesma imagem do webhook, outro processo (ADR 0001 e 0010); o build em cache sai instantâneo.
    build: { context: ., dockerfile: services/messaging-gateway/Dockerfile }
    image: whatsapp-booking-agent/messaging-gateway:dev
    profiles: [core]
    command: ["node", "--enable-source-maps", "dist/main-sender.js"]
    environment:
      <<: *gateway-env
      PORT: "8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      cloud-api-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  booking-agent:
    <<: *node-service
    build: { context: ., dockerfile: services/booking-agent/Dockerfile }
    image: whatsapp-booking-agent/booking-agent:dev
    profiles: [core]
    environment:
      <<: *common-env
      PORT: "8081"
      MCP_SERVER_URL: http://saas-mcp-server:8090/mcp
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-dev-only-mcp-token-change-me}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-dev-only-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b-instruct}
      STUDIO_TIMEZONE: ${STUDIO_TIMEZONE:-America/Sao_Paulo}
      OIDC_ISSUER: *oidc-issuer
      OIDC_AUDIENCE: wba-api
      # Miniaturas das imagens dos alunos, pela API interna do media-processor.
      MEDIA_PROCESSOR_URL: http://media-processor:8083
      MEDIA_API_TOKEN: ${MEDIA_API_TOKEN:-dev-only-media-token}
      OIDC_JWKS_URL: http://keycloak:8080/realms/wba/protocol/openid-connect/certs
      # Rota /internal (avisos por template), chamada pelo SaaS; o proxy do painel não a expõe.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-only-internal-token}
      REMINDER_TENANTS: ${REMINDER_TENANTS:-estudio-lotus}
    # Sem porta publicada no host: o painel só entra pelo api-gateway, que valida o JWT.
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      saas-mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Valida, guarda no S3 (LocalStack), gera miniatura e transcreve; baixa a mídia pela API interna do
  # messaging-gateway e nunca fala com um provedor de WhatsApp (ADR 0011).
  media-processor:
    build: ./services/media-processor
    image: whatsapp-booking-agent/media-processor:dev
    profiles: [core]
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-wba}:${RABBITMQ_PASSWORD:-dev-only-change-me}@rabbitmq:5672
      GATEWAY_URL: http://messaging-webhook:8080
      MEDIA_API_TOKEN: ${MEDIA_API_TOKEN:-dev-only-media-token}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-wba-media}
      S3_ENDPOINT_URL: http://localstack:4566
      # O LocalStack aceita qualquer credencial; na AWS de verdade troque por credenciais reais (ou uma role).
      AWS_ACCESS_KEY_ID: dev-only-localstack
      AWS_SECRET_ACCESS_KEY: dev-only-localstack
      AWS_DEFAULT_REGION: us-east-1
      TRANSCRIBER: ${TRANSCRIBER:-fake}
      # Métricas Prometheus (e a prova de vida) nesta porta.
      PORT: "8083"
    networks: [booking-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/metrics', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
      messaging-webhook:
        condition: service_healthy
      localstack:
        condition: service_healthy

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    image: whatsapp-booking-agent/web:dev
    profiles: [core]
    restart: unless-stopped
    environment:
      # O painel fala só com o api-gateway e entra com o Keycloak (authorization code + PKCE no navegador).
      # Nenhum token mora no servidor do painel: o nginx repassa o Authorization do navegador.
      GATEWAY_URL: http://api-gateway:8000
      OIDC_ISSUER: *oidc-issuer
      OIDC_CLIENT_ID: wba-panel
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    networks: [booking-net]
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:0.9.6
    profiles: [llm]
    volumes:
      - ollama-data:/root/.ollama
    networks: [booking-net]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    networks: [booking-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: [observability]
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    networks: [booking-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:13133/status"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-only-change-me}
    volumes:
      - ./infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [booking-net]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  keycloak-data:
  rabbitmq-data:
  redis-data:
  ollama-data:
  prometheus-data:
  grafana-data:

networks:
  booking-net:
    name: whatsapp-booking-net
